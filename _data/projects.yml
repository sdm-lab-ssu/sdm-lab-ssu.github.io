- title: "AX기반 제조공정활용기술 전문인력양성 사업 (온디바이스 AI 제조플랫폼)"
  english_title: "AX-Based Manufacturing Process Technology Development Program (On-Device AI Manufacturing Platform)"
  period: "Mar 2026 — Feb 2031"
  organization: "한국산업기술진흥원 (Korea Institute for Advancement of Technology, KIAT)"
  tags: ["On-Device AI", "EdTech", "sLLM", "Personalized Learning", "Edge Computing", "XR", "AI Agent"]
  summary: "에듀테크 플랫폼과 온디바이스 AI를 융합하는 실무형 석박사 전문인력을 양성하는 대학원 인력양성사업"
  details: >
    에듀테크 선도 기업의 실제 데이터를 활용하여 엣지 디바이스 환경의 경량화 LLM(sLLM) 및 AI 모델링 기술을 교육하는 현장 밀착형 교육과정을 구축한다.
    AI 에이전트 기반 개인화 학습시스템, XR 기반 실감형 교육 콘텐츠 등을 직접 개발하는 실무 교육을 제공하며,
    초개인화 학습지원 AI 에이전트·프라이버시 강화형 엣지 컴퓨팅·멀티모달 상호작용 기술 연구를 통해 온디바이스 AI 핵심 요소기술 및 서비스 모델을 개발한다.
    에듀테크 기업이 보유한 실제 학습 데이터와 엣지 디바이스 최적화 이슈를 해결하는 산학프로젝트를 발굴·수행하고,
    교류 프로그램을 통해 컨소시엄 기업으로 채용되는 선순환 인력양성 체계를 구축한다.
  links: []
  status: "ongoing"

- title: "메타휴리스틱 지식 전이와 진화적 강화학습 기반의 반도체 FAB 설비 신뢰성 대응 지능형 스케줄링 프레임워크"
  english_title: "An Intelligent Semiconductor FAB Scheduling Framework Based on Metaheuristic Knowledge Transfer and Evolutionary Reinforcement Learning with Equipment Reliability"
  period: "Sep 2026 — Aug 2031"
  organization: "한국연구재단 (National Research Foundation of Korea, NRF)"
  tags: ["Scheduling", "Evolutionary RL", "Metaheuristics", "Semiconductor FAB", "Case-Based Reasoning", "Predictive Maintenance", "MARL"]
  summary: "메타휴리스틱 전역 탐색과 진화적 강화학습의 실시간 대응 능력을 융합하여, 반도체 FAB의 복합 제약과 설비 신뢰성을 동시에 고려하는 강건한 지능형 스케줄링 프레임워크를 구축"
  details: >
    [1차년도] Q-time·재진입 흐름·Setup Change 등 복합 운영 제약을 정밀 모사하는 메타휴리스틱-강화학습 공용 이원화 FAB 시뮬레이터를 개발하고,
    유전알고리즘 기반 고품질 스케줄을 행동 복제(Behavior Cloning)로 활용하는 Warm-Start 초기 정책을 형성한다.
    [2차년도] 강화학습 에이전트의 실시간 디스패칭(하위 계층)과 메타휴리스틱 기반 정책 집단 진화(상위 계층)로 구성된 계층적 이중 제어 루프를 구현하고,
    긴급 주문·제품 혼합 변화 등 동적 시나리오 하에서 강건성 및 수렴 안정성을 정량 검증한다.
    [3차년도] Retrieve-Reuse-Revise-Retain 4단계 사례기반추론(CBR) 절차 기반 정책 전이 프레임워크를 구현하여,
    경험 축적에 따라 전이 성능이 향상되는 자기 강화형 일반화 구조를 완성한다.
    [4차년도] 확률분포 기반 설비 고장 모델을 시뮬레이터에 내재화하고,
    설비 상태·고장위험·예방보전 가능 시간을 고려하는 PM 에이전트와 스케줄링 에이전트 간 비동기 통신 프로토콜을 구축한다.
    [5차년도] 중앙화 학습-분산 실행(CTDE) 구조 기반 멀티에이전트 강화학습(MARL) 프레임워크로 스케줄링-PM 에이전트의 공동 최적화를 완성하고,
    벤치마크 데이터셋 및 오픈소스 코드를 공개하여 범용 제조 AI 운영 프레임워크를 확립한다.
  links: []
  status: "ongoing"

- title: "AI 기반 이미지 인식 및 추천 시스템 개발"
  period: "May 2024 — Jun 2024"
  organization: "Wayout Co., Ltd."
  image: /img/projects/wayout_ai_reco.jpg
  tags: ["Matirx Factorization", "Recommendation", "Machine Learning", "Industrial AI"]
  summary: "고객 평점 데이터를 기반으로 Matrix Factorization 추천 모델을 적용하여 캠핑용품/장소 추천 시스템을 개발"
  details: >
    아웃도어(캠핑) 용품 고객의 평점(rating) 데이터를 기반으로 개인화 추천 시스템을 구축한 프로젝트이다.
    Matrix Factorization 기반 협업필터링을 중심으로 사용자–아이템 잠재요인을 학습하고, 캠핑용품 및 캠핑장소 추천을 수행하였다.
    데이터 전처리, 모델 학습/추론 파이프라인 구성, 서비스 적용을 고려한 추천 결과 생성 및 운영 구조를 설계하였다.
    사용자 업로드 사진 내 용품 인식을 위한 이미지 인식 모듈을 보조 기능으로 결합하여 추천 경험을 강화하였다.
  links: []

- title: "Planning, Scheduling, and Dispatching Algorithms for Semiconductor Manufacturing"
  period: "Apr 2021 — Apr 2023"
  organization: "Gausslabs Inc. (with SK hynix)"
  image: /img/projects/gausslabs_semiconductor.jpg
  tags: ["Scheduling", "Dispatching", "Planning", "Semiconductor Manufacturing", "Optimization", "Simulation"]
  summary: "SK hynix 반도체 생산라인을 기반으로 Planning·Scheduling·Dispatching 기법을 연구하고 강화학습 기반 알고리즘을 개발"
  details: >
    SK하이닉스 반도체 생산라인을 대상으로 Planning·Scheduling·Dispatching 기법을 연구한 프로젝트이다.
    공정 특성과 제약을 반영한 생산 시뮬레이터를 구축하고, 다양한 운영 정책과 알고리즘의 성능을 시뮬레이션 기반으로 평가하였다.
    Proof of Concept(POC) 단계에서 Q-time 제약이 존재하는 생산환경에 대해 강화학습 기반 Scheduling/Dispatching 알고리즘을 적용하였다.
    설비 가동률을 향상시키고 Q-time 제약 위반 Lot 수를 최소화하는 결과를 성공적으로 도출하였다.
  links: []

- title: "메타휴리스틱과 심층강화학습을 이용한 실시간 제조라인 일정계획 수립 기법"
  period: "Mar 2020 — Feb 2023"
  organization: "National Research Foundation of Korea (NRF)"
  image: /img/projects/nrf_rl_meta_scheduling.jpg
  tags: ["Scheduling", "Metaheuristics", "Deep RL", "Simulation", "Optimization"]
  summary: "제조라인 시뮬레이션을 기반으로 메타휴리스틱과 심층강화학습을 결합한 실시간 일정계획 기법을 개발"
  details: >
    대규모·복잡 제약을 갖는 제조라인 일정계획 문제를 대상으로 한 실시간 스케줄링 방법론 개발 과제이다.
    제조라인 시뮬레이터를 구축하고 상태/행동/보상 구조를 설계하여 심층강화학습 기반 의사결정 모델을 학습하였다.
    학습 안정성 및 해 품질 향상을 위해 메타휴리스틱 탐색을 결합하고, 하이브리드 최적화 전략을 통해 빠른 재계획을 지원하였다.
    다양한 생산 조건 및 교란 상황(고장, 공정 변동 등)에서도 성능을 유지하는 강건한 스케줄링 정책 설계를 목표로 하였다.
  links: []
