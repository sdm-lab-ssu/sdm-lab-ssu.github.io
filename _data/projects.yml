- title: "AI 기반 이미지 인식 및 추천 시스템 개발"
  period: "May 2024 — Jun 2024"
  organization: "Wayout Co., Ltd."
  image: /img/projects/wayout_ai_reco.jpg
  tags: ["Matirx Factorization", "Recommendation", "Machine Learning", "Industrial AI"]
  summary: "Developed an AI-driven image recognition and recommendation system for practical industrial applications."
