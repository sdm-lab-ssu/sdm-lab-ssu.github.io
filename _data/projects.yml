- title: "AI-based Image Recognition & Recommendation System"
  period: "May 2024 — Jun 2024"
  organization: "Wayout Co., Ltd."
  image: /img/projects/wayout_ai_reco.jpg
  tags: ["Computer Vision", "Recommendation", "Machine Learning", "Industrial AI"]
  summary: "Developed an AI-driven image recognition and recommendation system for practical industrial applications."
  details: >
    Developed an AI-based image recognition pipeline and integrated it with a recommendation module to support
    user-facing and business-oriented decision support. The project focused on end-to-end system development,
