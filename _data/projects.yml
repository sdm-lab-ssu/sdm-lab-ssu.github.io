- title: "Planning, Scheduling, and Dispatching Algorithms for Semiconductor Manufacturing"
  period: "Apr 2021 — Apr 2023"
  organization: "Gausslabs Inc. (with SK hynix)"
  image: /img/projects/gausslabs_semiconductor.jpg
  tags: ["Scheduling", "Dispatching", "Planning", "Semiconductor Manufacturing", "Optimization", "Simulation"]
  summary: "Researched and developed algorithms for planning, scheduling, and dispatching in semiconductor manufacturing."
  details: >
    Conducted research and development on planning, scheduling, and dispatching methods for semiconductor
    manufacturing operations in collaboration with SK hynix. The work emphasized practical constraints and
    industrial scalability, with a simulation-first approach to validate algorithmic performance and robustness.
  links: []

- title: "메타휴리스틱과 심층강화학습을 이용한 실시간 제조라인 일정계획 수립 기법"
  period: "Mar 2020 — Feb 2023"
  organization: "National Research Foundation of Korea (NRF)"
  image: /img/projects/nrf_rl_meta_scheduling.jpg
  tags: ["Metaheuristics", "Reinforcement Learning", "Deep RL", "Scheduling", "Optimization", "Real-time Control", "Simulation"]
  summary: "Developed real-time production scheduling methods combining metaheuristics and deep reinforcement learning."
  details: >
    본 연구는 메타휴리스틱과 심층강화학습을 결합해 실시간 제조라인 일정계획 기법을 개발합니다.
    학습 기반 의사결정의 장점과 탐색 기반 최적화의 강점을 함께 활용하여, 빠르고 안정적인 스케줄링을 목표로 합니다.
    시뮬레이션 기반 검증을 통해 다양한 생산 조건과 교란 상황에서도 강건한 정책을 설계합니다.
  links: []
