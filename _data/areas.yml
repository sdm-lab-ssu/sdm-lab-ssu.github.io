- key: scheduling_optimization
  title: Scheduling & Optimization for Manufacturing Systems
  tagline: "Decision-making under constraints in complex production environments"
  image: /img/areas/scheduling.jpg
  description: >
    We develop scheduling and optimization methods for complex manufacturing systems
    such as semiconductor facilities and smart factories. Our work focuses on scalable
    and robust decision-making under realistic operational constraints.
  topics:
    - "Semiconductor manufacturing scheduling & dispatching"
    - "Constraint-aware scheduling (e.g., queue-time limits)"
    - "Robust and real-time decision support"
  tags: ["scheduling", "dispatching", "semiconductor", "optimization"]

- key: learning_heuristics
  title: Reinforcement Learning & Metaheuristics for Optimization
  tagline: "Learning and search-based approaches for complex decision problems"
  image: /img/areas/rl_meta.jpg
  description: >
    We study both reinforcement learning (RL) and metaheuristics as core optimization paradigms.
    While scheduling and dispatching remain our primary application domains, we are equally
    interested in the methodologies themselves — improving their robustness, scalability, and
    practical usability — and applying them to broader decision-making and optimization problems.
    We also explore hybrid approaches that combine learning-based policies with heuristic search.
  topics:
    - "Reinforcement learning for sequential decision making"
    - "Metaheuristics (GA/PSO/SA) for combinatorial optimization"
    - "Hybrid RL + heuristic search / optimization"
    - "Beyond scheduling: applying optimization methods to broader domains"
  tags: ["rl", "reinforcement-learning", "drl", "metaheuristics", "ga", "pso", "hybrid-optimization"]


- key: data_driven_ai
  title: Data-driven AI & Industrial Analytics
  tagline: "Machine learning models for prediction and decision support"
  image: /img/areas/ml.jpg
  description: >
    We apply machine learning to industrial and operational datasets to support
    prediction, classification, and data-driven decision making. This includes time-series
    learning and practical analytics systems.
  topics:
    - "Time-series representation learning"
    - "Semi-supervised / contrastive learning"
    - "Predictive analytics and decision support"
  tags: ["machine-learning", "time-series", "contrastive-learning"]
