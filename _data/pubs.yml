- short_id: "park2026genetic"
  title: "A genetic algorithm with feasibility-agnostic encoding and three-phase decoding for scheduling problems in semiconductor manufacturing"
  authors: "In-Beom Park, Jaeseok Huh*"
  venue: "Expert Systems with Applications, 2026"
  site: "https://www.sciencedirect.com/science/article/pii/S0957417425039259"
  img: "../img/papers/FA3FD2.png"
  abs: >-
    Queue time (Q-time) limits, which refer to the allowable time intervals between consecutive processing steps, play an essential role in the semiconductor industry. This importance stems from the fact that violations of Q-time limits are highly likely to degrade product quality and yield, ultimately resulting in resource waste, reprocessing, and increased environmental impact. To address these challenges, we propose a novel genetic algorithm for solving scheduling problems in semiconductor manufacturing facilities with sequence-dependent setups, aiming to minimize a weighted sum of the makespan and the total time exceeding the Q-time limits. Specifically, we introduce a feasibility-agnostic encoding scheme and a three-phase decoding procedure that consists of job assignment, feasibility adjustment, and machine allocation. Furthermore, customized crossover and mutation operators are incorporated to enhance the exploration of the solution space. Comprehensive experiments on six datasets demonstrate the superiority of the proposed method compared to other metaheuristics. Based on the improvement of baseline metaheuristics when initialized with the solutions generated by the proposed encoding and decoding procedures, we verify the viability of the proposed method.
  bib: |-
    @article{park2026genetic,
       title={A genetic algorithm with feasibility-agnostic encoding and three-phase decoding for scheduling semiconductor manufacturing facilities under queue time limits},
        author={Park, In-Beom and Huh, Jaeseok},
        journal={Expert Systems with Applications},
        volume={301},
        pages={130310},
        year={2026},
        publisher={Elsevier}
    }
  tags:
    - genetic algorithm
    - scheduling
    - semiconductor manufacturing
    - optimization



- short_id: "ko2025_swevo"
  title: "Metaheuristic-based weight optimization for robust deep reinforcement learning in continuous control"
  authors: "Gwang-Jong Ko, Jaeseok Huh*"
  venue: "Swarm and Evolutionary Computation, 2025"
  site: "https://doi.org/10.1016/j.swevo.2025.101920"    # 제목에 걸 링크
  img: "../img/papers/metaRL.gif"
  abs: >-
    In recent studies, the policy-based deep reinforcement learning (DRL) algorithms have exhibited superior
    performance in addressing continuous control problems, such as machine arms control and robot gait learning.
    However, these algorithms frequently face challenges inherent in gradient descent-based weight optimization
    methods, including susceptibility to local optima, slow learning speeds due to saddle points, approximation
    errors, and suboptimal hyperparameters. This instability leads to significant performance discrepancies among
    agent instances trained under identical settings, which complicates the practical application of reinforcement
    learning. To address this, we propose a metaheuristic-based weight optimization framework designed to mitigate
    learning instability in DRL for continuous control tasks. The proposed framework introduces a two-phase
    optimization process, where an additional search phase using swarm intelligence algorithms is conducted at the
    end of the learning phase utilizing DRL. In numerical experiments, the proposed framework demonstrated superior
    and more stable performance compared to conventional DRL algorithms in robot locomotion tasks.
  bib: |-
    @article{ko2025metaheuristic,
      title={Metaheuristic-based weight optimization for robust deep reinforcement learning in continuous control},
      author={Ko, Gwang-Jong and Huh, Jaeseok},
      journal={Swarm and Evolutionary Computation},
      volume={95},
      pages={101920},
      year={2025},
      publisher={Elsevier}
    }
